name: Check Secret
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check if secret exists
        run: |
          if [[ -z "${{ secrets.METRICS_TOKEN }}" ]]; then
            echo "❌ SECRET IS EMPTY / NOT FOUND"
          else
            echo "✅ SECRET EXISTS, GitHub成功读到"
          fi
